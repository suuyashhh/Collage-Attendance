<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Premium Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            glow: {
              '0%': { boxShadow: '0 0 15px rgba(168, 85, 247, 0.3)' },
              '100%': { boxShadow: '0 0 25px rgba(168, 85, 247, 0.6)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-morphism {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .input-glow:focus {
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.15),
                  0 0 18px rgba(168, 85, 247, 0.3);
    }
    .page-gradient {
      background: rgba(243, 244, 247, 1);
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body class="page-gradient flex items-center justify-center min-h-screen p-4 sm:p-6">
  <!-- Floating Background -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-16 left-12 w-20 h-20 bg-white/10 rounded-full animate-float"></div>
    <div class="absolute bottom-28 right-16 w-24 h-24 bg-purple-300/20 rounded-full animate-float" style="animation-delay: 2s;"></div>
    <div class="absolute top-1/3 left-1/4 w-16 h-16 bg-pink-300/15 rounded-full animate-float" style="animation-delay: 1s;"></div>
  </div>

  <!-- Login Card -->
  <div class="w-full max-w-md glass-morphism rounded-2xl shadow-2xl border border-white/30 overflow-hidden">
    <!-- Browser Header -->
    <div class="bg-gray-100/90 backdrop-blur-sm px-4 py-2 flex items-center border-b border-white/30">
      <div class="flex space-x-2">
        <div class="w-3 h-3 bg-red-500 rounded-full"></div>
        <div class="w-3 h-3 bg-yellow-500 rounded-full"></div>
        <div class="w-3 h-3 bg-green-500 rounded-full"></div>
      </div>
      <div class="flex-1 text-end">
        <span class="text-gray-600 text-xs font-medium">🔒 TKIET.app</span>
      </div>
    </div>

    <!-- Header -->
   <!-- Header -->
    <div class="h-28 sm:h-32 w-full overflow-hidden rounded-t-2xl">
  <img src="/assets/img/CollageAtt/Tatyasahebcore.webp" 
       alt="Header Image" 
       class="w-full h-full object-cover">
</div>


    <!-- Form -->
    <div class="bg-white/95 px-6 py-8 sm:px-8">
      <form class="space-y-5">
        <!-- Inputs -->
        <div class="space-y-4">
          <input type="text" placeholder="Username or Email"
            class="w-full px-4 py-3 rounded-lg bg-gray-50/80 border border-gray-300 
                   focus:border-purple-500 input-glow text-gray-800 font-medium
                   placeholder-gray-400 transition-all"/>
          
          <input type="password" placeholder="Password"
            class="w-full px-4 py-3 rounded-lg bg-gray-50/80 border border-gray-300 
                   focus:border-purple-500 input-glow text-gray-800 font-medium
                   placeholder-gray-400 transition-all"/>
        </div>

        <!-- Options -->
        <div class="flex items-center justify-between text-sm text-gray-600">
          <label class="flex items-center space-x-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
            <span>Remember me</span>
          </label>
          <a href="#" class="text-purple-600 hover:text-purple-700 font-medium">Forgot?</a>
        </div>

        <!-- Buttons -->
        <button type="submit" routerLink='/student'
          class="w-full py-3 rounded-lg bg-gradient-to-r from-teal-500 to-blue-500 
                 hover:from-teal-600 hover:to-blue-600 text-white font-semibold
                 transition-transform transform hover:scale-105 animate-glow shadow-lg">
          Sign In
        </button>
      </form>

      <!-- Footer -->
      <p class="text-center text-gray-600 text-sm mt-6">
        Don’t have an account? 
        <a href="#" class="text-purple-600 hover:text-purple-700 font-semibold">Sign up</a>
      </p>
    </div>
  </div>
</body>
</html>
